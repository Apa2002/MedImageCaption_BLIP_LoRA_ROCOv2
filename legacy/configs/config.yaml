# ==== Paths ====
paths:
  root: "./data"
  train_images_dir: "./data/train_ROCOv2/train"
  test_images_dir: "./data/test_ROCOv2/test"
  train_csv: "./data/train_captions.csv"
  test_csv: "./data/test_captions.csv"
  output_dir: "./checkpoints/blip-finetuned"

# ==== Data ====
data:
  image_size: 224
  train_fraction: 0.10   # use 10% of training data (as in the notebook)
  seed: 42

# ==== Model ====
model:
  base_model: "Salesforce/blip-image-captioning-base"
  lora:
    r: 8
    alpha: 16
    dropout: 0.1
    bias: "none"
    target_modules: ["attention.self.query", "attention.self.key"]

# ==== Training ====
training:
  batch_size: 3
  num_epochs: 6
  learning_rate: 5e-5
  lr_scheduler: "linear"
  warmup_steps: 0

# ==== Evaluation ====
evaluation:
  num_beams: 4
  max_length: 128
  metrics: ["bleu", "meteor", "rouge_l", "cider"]
